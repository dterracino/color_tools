name: Tests & Coverage

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[image,interactive,mcp,dev]"
          pip install codecov

      - name: Run tests with coverage
        run: |
          python -m pytest --cov=color_tools --cov-branch --cov-report=term-missing --cov-report=xml

      - name: Check repository strict typing
        if: matrix.python-version == '3.12'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[all,docs,dev]" pytest "pygame>=2.5.0" "moderngl>=5.10.0"
          .venv/bin/pyright --project pyrightconfig.json --warnings

      - name: Verify installed-wheel type completeness
        if: matrix.python-version == '3.12'
        run: |
          TYPECHECK_ROOT="$RUNNER_TEMP/color-tools-typecheck"
          python -m build --wheel --outdir "$TYPECHECK_ROOT/dist"
          python -m venv "$TYPECHECK_ROOT/base-venv"
          python -m venv "$TYPECHECK_ROOT/venv"
          WHEEL_PATH=$(find "$TYPECHECK_ROOT/dist" -name '*.whl' -print -quit)
          "$TYPECHECK_ROOT/base-venv/bin/python" -m pip install "$WHEEL_PATH" pyright
          "$TYPECHECK_ROOT/venv/bin/python" -m pip install "$WHEEL_PATH[all]" pyright
          cp tests/typecheck/base_consumer.py "$TYPECHECK_ROOT/base_consumer.py"
          cp tests/typecheck/strict_consumer.py "$TYPECHECK_ROOT/strict_consumer.py"
          cd "$TYPECHECK_ROOT"
          . base-venv/bin/activate
          pyright base_consumer.py
          deactivate
          . venv/bin/activate
          pyright --verifytypes color_tools --ignoreexternal
          pyright strict_consumer.py

      - name: Upload coverage to Codecov
        # Only upload from one Python version to avoid duplicate reports
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
