[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "color-match-tools"
version = "6.11.4"
description = "Comprehensive color science library for accurate color space conversions, perceptual color distance metrics (Delta E), and color matching with CSS and 3D printing filament databases"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "David Terracino", email = "dterracino@gmail.com" }
]
keywords = ["color", "color-science", "delta-e", "color-conversion", "color-matching", "rgb", "lab", "lch", "hsl", "xyz", "ciede2000", "cie94", "cie76", "gamut", "srgb", "3d-printing", "filament"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

# No external dependencies - pure Python stdlib!
dependencies = []

[project.optional-dependencies]
# Enhanced fuzzy matching for validation module
fuzzy = [
    "rapidfuzz>=3.0.0",
]

# Image processing features (requires Pillow and numpy)
image = [
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "scikit-image>=0.20.0",
    "pillow-heif>=0.14.0",  # HEIC format support (AVIF supported natively in Pillow 10+)
    "cairosvg>=2.7.0",      # SVG watermark support
    "opencv-contrib-python>=4.8.0",
    "scikit-learn>=1.3.0",
    "swatch>=0.4.0",        # For ASE palette support
]

# Interactive filament library management (TUI)
interactive = [
    "prompt_toolkit>=3.0.0",
]

# Colorized console logging (via Rich)
logging = [
    "rich>=13.0.0",
]

# Model Context Protocol server for agent integrations
mcp = [
    "mcp>=2.0.0,<3",
]

# Documentation generation
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
    "sphinx-autodoc-typehints>=1.24.0",
]

# Development tools
dev = [
    "pyright>=1.1.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "coverage>=7.0.0",
]

# Everything (all optional user-facing features)
all = [
    "color-match-tools[fuzzy]",
    "color-match-tools[image]",
    "color-match-tools[interactive]",
    "color-match-tools[logging]",
    "color-match-tools[mcp]",
]

[project.urls]
Homepage = "https://github.com/dterracino/color_tools"
Repository = "https://github.com/dterracino/color_tools"
Issues = "https://github.com/dterracino/color_tools/issues"
Changelog = "https://github.com/dterracino/color_tools/blob/main/CHANGELOG.md"
Documentation = "https://dterracino.github.io/color_tools/"

[project.scripts]
color_tools = "color_tools.cli:main"
color-tools-mcp = "color_tools.mcp:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["color_tools", "color_tools.*"]
exclude = ["color_tools.data*", "tests*", "test_*"]

[tool.setuptools.package-data]
color_tools = ["data/*.json", "data/palettes/*.json"]
